# 打 tag 就自动构建 Ferry.exe / Ferry.app 并发布到 Releases。
#
# 二进制不进 git：PyInstaller 产物 11 MB 且几乎不可 delta 压缩，每次重新
# 构建都是一个全新 blob，会永久留在历史里。Releases 才是放它们的地方。
#
#   手动跑一次（产物存 artifact，不建 Release）：
#     仓库 Actions 页 → Build and release → Run workflow
#   正式发布：
#     git tag v1.0.0 && git push origin v1.0.0
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # 建 Release 需要

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 和本地 npm run build 用的是同一条命令，避免 CI 和手工构建各跑各的
      - name: 安装依赖并构建
        shell: pwsh
        working-directory: electron
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # ferry_core.py / ferry_agent.py / ui 已经由 --extra-resource 打进
      # resources/，这里只补上 setup 脚本和 README
      - name: 组装发布包
        shell: pwsh
        run: |
          Copy-Item setup-windows.ps1, README.md _electron\Ferry-win32-x64
          Compress-Archive -Path _electron\Ferry-win32-x64 -DestinationPath Ferry-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Ferry-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖并构建
        working-directory: electron
        run: |
          npm ci --no-audit --no-fund
          npx electron-packager . Ferry --overwrite --platform=darwin --arch=universal \
            --icon=../assets/ferry.icns --out=../_electron \
            --extra-resource=../ferry_core.py --extra-resource=../ferry_agent.py \
            --extra-resource=../ui --extra-resource=../assets

      - name: 组装发布包
        run: |
          cp setup-mac.sh README.md _electron/Ferry-darwin-universal/
          # 用 ditto 而不是 zip：.app 里的可执行位要保住，否则解压出来点不开
          ditto -c -k --sequesterRsrc --keepParent _electron/Ferry-darwin-universal Ferry-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Ferry-macos.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # runner 自带 gh，配内置 GITHUB_TOKEN，不引第三方 action
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
             Ferry-windows-x64.zip Ferry-macos.zip \
             --repo "$GITHUB_REPOSITORY" \
             --title "$GITHUB_REF_NAME" \
             --notes-file .github/release-notes.md
